name: Ops Desktop CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: xvfb-run --auto-servernum pnpm verify

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-build
          path: dist
          if-no-files-found: error

  mac-build:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            executable_arch: arm64
            os: macos-15
          - arch: x64
            executable_arch: x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Mac package for CI
        if: github.event_name != 'release'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm electron:build:mac:${{ matrix.arch }}

      - name: Validate Mac release credentials
        if: github.event_name == 'release'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required macOS release secret: ${name}"
              exit 1
            fi
          done

      - name: Build signed and notarized Mac package
        if: github.event_name == 'release'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm build
          pnpm exec electron-builder --mac --${{ matrix.arch }} --config.forceCodeSigning=true

      - name: Verify packaged Mac architecture
        run: |
          APP_PATH="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Packaged macOS app was not found"
            exit 1
          fi

          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/Ops Desktop"
          ARCHS="$(lipo -archs "$APP_EXECUTABLE")"
          echo "Built architectures: $ARCHS"
          if [[ " $ARCHS " != *" ${{ matrix.executable_arch }} "* ]]; then
            echo "::error::Expected architecture ${{ matrix.executable_arch }}, got $ARCHS"
            exit 1
          fi

      - name: Smoke test packaged Mac app
        run: node scripts/mac-packaged-app-smoke.cjs --arch=${{ matrix.arch }}

      - name: Verify signed and notarized Mac app
        if: github.event_name == 'release'
        run: |
          APP_PATH="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  win-build:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        run: pnpm electron:build:win

      - name: Smoke test packaged Windows app
        run: node scripts/windows-packaged-app-smoke.cjs --arch=x64 --ccswitch-fixture

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-win
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux
        run: pnpm electron:build:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [mac-build, win-build, linux-build]
    if: github.event_name == 'release'
    steps:
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ops-desktop-mac-*
          path: release
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-desktop-win
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-desktop-linux
          path: release

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
