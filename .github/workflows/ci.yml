name: Ops Desktop CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run tests
        run: pnpm test
      
      - name: Run check
        run: pnpm check

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build
        run: pnpm build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-build
          path: dist
          if-no-files-found: error

  mac-build:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build Mac DMG
        run: pnpm electron:build:mac
      
      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: Ops Desktop-mac-dmg
          path: release/*.dmg
          if-no-files-found: error

  win-build:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build Windows
        run: pnpm electron:build:win
      
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Ops Desktop-win
          path: release/*.exe
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build Linux
        run: pnpm electron:build:linux
      
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ops Desktop-linux
          path: release/*.AppImage
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [mac-build, win-build, linux-build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.zip
