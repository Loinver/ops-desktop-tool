name: Ops Desktop CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must exactly match package.json version tag $expected_tag"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: xvfb-run --auto-servernum pnpm verify

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-build
          path: dist
          if-no-files-found: error

  mac-build:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            executable_arch: arm64
            os: macos-15
          - arch: x64
            executable_arch: x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warn about unsigned Mac release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::warning::macOS release artifacts are not signed with Apple Developer ID and are not notarized."

      - name: Build Mac package without Developer ID signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm electron:build:mac:${{ matrix.arch }}

      - name: Verify packaged Mac architecture
        run: |
          APP_PATH="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Packaged macOS app was not found"
            exit 1
          fi

          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/Ops Desktop"
          ARCHS="$(lipo -archs "$APP_EXECUTABLE")"
          echo "Built architectures: $ARCHS"
          if [[ " $ARCHS " != *" ${{ matrix.executable_arch }} "* ]]; then
            echo "::error::Expected architecture ${{ matrix.executable_arch }}, got $ARCHS"
            exit 1
          fi

      - name: Smoke test packaged Mac app
        run: node scripts/mac-packaged-app-smoke.cjs --arch=${{ matrix.arch }}

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  win-build:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm electron:build:win:${{ matrix.arch }}

      - name: Verify signed Windows artifacts when certificate is configured
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Host 'Windows signing certificate is not configured; skipping Authenticode verification.'
            exit 0
          }
          $targets = @(
            Get-ChildItem release -Recurse -File -Filter 'Ops Desktop.exe'
            Get-ChildItem release -File -Filter '*.exe'
          ) | Sort-Object -Property FullName -Unique
          if ($targets.Count -eq 0) {
            throw 'No Windows executables were found for Authenticode verification.'
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode signature is invalid for $($target.FullName): $($signature.Status)"
            }
          }

      - name: Smoke test packaged Windows app
        run: node scripts/windows-packaged-app-smoke.cjs --arch=${{ matrix.arch }} --ccswitch-fixture

      - name: Smoke test Windows installer lifecycle
        run: node scripts/windows-installer-smoke.cjs --arch=${{ matrix.arch }} --allow-install

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-win-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [mac-build, win-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ops-desktop-mac-*
          path: release
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ops-desktop-win-*
          path: release
          merge-multiple: true

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            macOS packages in this release are not signed with an Apple Developer ID certificate and are not notarized. macOS may display a security warning when opening them.
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
