name: Ops Desktop CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: xvfb-run --auto-servernum pnpm verify

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-build
          path: dist
          if-no-files-found: error

  mac-build:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Mac DMG
        run: pnpm electron:build:mac

      - name: Upload Mac DMG
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-mac-dmg
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  win-build:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        run: pnpm electron:build:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-win
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  linux-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux
        run: pnpm electron:build:linux

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [mac-build, win-build, linux-build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-desktop-mac-dmg
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-desktop-win
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ops-desktop-linux
          path: release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
