name: Ops Desktop CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME must exactly match package.json version tag $expected_tag"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: xvfb-run --auto-servernum pnpm verify

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  release-init:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create or resume draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_list_api="repos/$GITHUB_REPOSITORY/releases?per_page=100"
          published_release_id="$(gh api "$release_list_api" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft == false) | .id" \
            | head -n 1)"
          if [ -n "$published_release_id" ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published; refusing to overwrite its assets"
            exit 1
          fi

          draft_release_id="$(gh api "$release_list_api" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft == true)] | sort_by(.assets | length) | reverse | .[0].id // empty")"
          if [ -n "$draft_release_id" ]; then
            echo "Resuming existing draft release $GITHUB_REF_NAME (id $draft_release_id)"
            exit 0
          fi

          body=$(cat <<'EOF'
          macOS packages in this release are not signed with an Apple Developer ID certificate and are not notarized. macOS may display a security warning when opening them.
          SHA256SUMS.txt is included for the in-app GitHub Release updater.
          EOF
          )
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="$GITHUB_REF_NAME" \
            -f body="$body" \
            -F draft=true \
            -F generate_release_notes=true \
            --silent

  mac-build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    needs: [build, release-init]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.release-init.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            executable_arch: arm64
            os: macos-15
          - arch: x64
            executable_arch: x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warn about unsigned Mac release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::warning::macOS release artifacts are not signed with Apple Developer ID and are not notarized."

      - name: Build Mac package without Developer ID signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm electron:build:mac:${{ matrix.arch }}

      - name: Verify packaged Mac architecture
        run: |
          APP_PATH="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Packaged macOS app was not found"
            exit 1
          fi

          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/Ops Desktop"
          ARCHS="$(lipo -archs "$APP_EXECUTABLE")"
          echo "Built architectures: $ARCHS"
          if [[ " $ARCHS " != *" ${{ matrix.executable_arch }} "* ]]; then
            echo "::error::Expected architecture ${{ matrix.executable_arch }}, got $ARCHS"
            exit 1
          fi

      - name: Smoke test packaged Mac app
        run: node scripts/mac-packaged-app-smoke.cjs --arch=${{ matrix.arch }}

      - name: Prepare Mac release assets and checksum fragment
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd release
          for extension in dmg zip; do
            asset_name="Ops Desktop-${version}-${{ matrix.arch }}.${extension}"
            if [ ! -f "$asset_name" ]; then
              echo "::error::Expected release asset was not found: $asset_name"
              exit 1
            fi
          done
          shasum -a 256 -- \
            "Ops Desktop-${version}-${{ matrix.arch }}.dmg" \
            "Ops Desktop-${version}-${{ matrix.arch }}.zip" \
            > "checksums-mac-${{ matrix.arch }}.txt"

      - name: Upload Mac assets directly to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "release/Ops Desktop-${version}-${{ matrix.arch }}.dmg" \
            "release/Ops Desktop-${version}-${{ matrix.arch }}.zip" \
            "release/checksums-mac-${{ matrix.arch }}.txt" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  win-build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    needs: [build, release-init]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' &&
      needs.release-init.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm electron:build:win:${{ matrix.arch }}

      - name: Verify signed Windows artifacts when certificate is configured
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Host 'Windows signing certificate is not configured; skipping Authenticode verification.'
            exit 0
          }
          $targets = @(
            Get-ChildItem release -Recurse -File -Filter 'Ops Desktop.exe'
            Get-ChildItem release -File -Filter '*.exe'
          ) | Sort-Object -Property FullName -Unique
          if ($targets.Count -eq 0) {
            throw 'No Windows executables were found for Authenticode verification.'
          }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode signature is invalid for $($target.FullName): $($signature.Status)"
            }
          }

      - name: Smoke test packaged Windows app
        run: node scripts/windows-packaged-app-smoke.cjs --arch=${{ matrix.arch }} --ccswitch-fixture

      - name: Smoke test Windows installer lifecycle
        run: node scripts/windows-installer-smoke.cjs --arch=${{ matrix.arch }} --allow-install

      - name: Prepare Windows release assets and checksum fragment
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $assetNames = @(
            "Ops Desktop-$version-windows-${{ matrix.arch }}.exe",
            "Ops Desktop-$version-windows-${{ matrix.arch }}.zip"
          )
          foreach ($assetName in $assetNames) {
            $assetPath = Join-Path release $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Expected release asset was not found: $assetName"
            }
          }
          $checksumLines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path release $assetName
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $assetName"
          }
          $checksumLines | Set-Content -LiteralPath "release/checksums-win-${{ matrix.arch }}.txt" -Encoding ascii

      - name: Upload Windows assets directly to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          gh release upload $env:GITHUB_REF_NAME `
            "release/Ops Desktop-$version-windows-${{ matrix.arch }}.exe" `
            "release/Ops Desktop-$version-windows-${{ matrix.arch }}.zip" `
            "release/checksums-win-${{ matrix.arch }}.txt" `
            --clobber `
            --repo $env:GITHUB_REPOSITORY

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [mac-build, win-build, release-init]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download checksum fragments from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'checksums-*.txt' \
            --dir release \
            --repo "$GITHUB_REPOSITORY"

      - name: Generate and validate update checksums
        shell: bash
        run: |
          set -euo pipefail
          cat release/checksums-*.txt | sort -k2 > release/SHA256SUMS.txt
          expected_assets=(
            "Ops Desktop-${GITHUB_REF_NAME#v}-arm64.dmg"
            "Ops Desktop-${GITHUB_REF_NAME#v}-arm64.zip"
            "Ops Desktop-${GITHUB_REF_NAME#v}-x64.dmg"
            "Ops Desktop-${GITHUB_REF_NAME#v}-x64.zip"
            "Ops Desktop-${GITHUB_REF_NAME#v}-windows-arm64.exe"
            "Ops Desktop-${GITHUB_REF_NAME#v}-windows-arm64.zip"
            "Ops Desktop-${GITHUB_REF_NAME#v}-windows-x64.exe"
            "Ops Desktop-${GITHUB_REF_NAME#v}-windows-x64.zip"
          )
          if [ "$(wc -l < release/SHA256SUMS.txt | tr -d ' ')" -ne "${#expected_assets[@]}" ]; then
            echo "::error::SHA256SUMS.txt must contain exactly ${#expected_assets[@]} assets"
            cat release/SHA256SUMS.txt
            exit 1
          fi
          for asset in "${expected_assets[@]}"; do
            if ! grep -Fq "  $asset" release/SHA256SUMS.txt; then
              echo "::error::Missing checksum entry for $asset"
              exit 1
            fi
          done

      - name: Upload checksum manifest and remove temporary fragments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" release/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
          for fragment in release/checksums-*.txt; do
            gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$fragment")" \
              --yes \
              --repo "$GITHUB_REPOSITORY"
          done

      - name: Remove legacy dot-named release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          legacy_assets=(
            "Ops.Desktop-${version}-arm64.dmg"
            "Ops.Desktop-${version}-arm64.zip"
            "Ops.Desktop-${version}-x64.dmg"
            "Ops.Desktop-${version}-x64.zip"
            "Ops.Desktop-${version}-windows-arm64.exe"
            "Ops.Desktop-${version}-windows-arm64.zip"
            "Ops.Desktop-${version}-windows-x64.exe"
            "Ops.Desktop-${version}-windows-x64.zip"
          )
          for asset in "${legacy_assets[@]}"; do
            gh release delete-asset "$GITHUB_REF_NAME" "$asset" \
              --yes \
              --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Publish completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"
