name: Ops Desktop Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run Performance Tests
        run: |
          pnpm test:performance || echo "Performance tests skipped"
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ops-desktop-monitoring
          path: |
            dist
            release
          if-no-files-found: error

      - name: Error Monitoring
        if: always()
        run: |
          echo "Monitoring errors for future logging"
